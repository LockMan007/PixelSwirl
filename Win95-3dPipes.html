<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pipes Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Include Three.js for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let pipes = [];
        const MAX_PIPES = 8;
        const GRID_SIZE = 2;
        const RANGE = 30;

        const colors = [
            0x00ff00, // Green
            0xff0000, // Red
            0x0000ff, // Blue
            0xffff00, // Yellow
            0x00ffff, // Cyan
            0xff00ff, // Magenta
            -1        // Special flag for multicolored/textured joint look
        ];

        class PipeSystem {
            constructor() {
                this.reset();
            }

            reset() {
                this.group = new THREE.Group();
                scene.add(this.group);
                
                this.x = (Math.floor(Math.random() * RANGE) - RANGE / 2) * GRID_SIZE;
                this.y = (Math.floor(Math.random() * RANGE) - RANGE / 2) * GRID_SIZE;
                this.z = (Math.floor(Math.random() * RANGE) - RANGE / 2) * GRID_SIZE;

                this.dir = new THREE.Vector3(1, 0, 0);
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                this.material = new THREE.MeshPhongMaterial({
                    color: this.color === -1 ? Math.random() * 0xffffff : this.color,
                    shininess: 90,
                    specular: 0x444444
                });

                this.segmentsDrawn = 0;
                this.maxSegments = 50 + Math.floor(Math.random() * 50);
                this.active = true;
            }

            update() {
                if (!this.active) return;

                // Pick a new random direction occasionally
                if (Math.random() < 0.2) {
                    const dirs = [
                        new THREE.Vector3(GRID_SIZE, 0, 0),
                        new THREE.Vector3(-GRID_SIZE, 0, 0),
                        new THREE.Vector3(0, GRID_SIZE, 0),
                        new THREE.Vector3(0, -GRID_SIZE, 0),
                        new THREE.Vector3(0, 0, GRID_SIZE),
                        new THREE.Vector3(0, 0, -GRID_SIZE)
                    ];
                    // Filter out opposite direction to avoid folding back immediately
                    const validDirs = dirs.filter(d => !d.equals(this.dir.clone().negate()));
                    this.dir = validDirs[Math.floor(Math.random() * validDirs.length)];
                }

                const prevX = this.x;
                const prevY = this.y;
                const prevZ = this.z;

                this.x += this.dir.x;
                this.y += this.dir.y;
                this.z += this.dir.z;

                // Create joint sphere
                const sphereGeo = new THREE.SphereGeometry(0.45, 16, 16);
                const sphere = new THREE.Mesh(sphereGeo, this.material);
                sphere.position.set(this.x, this.y, this.z);
                this.group.add(sphere);

                // Create cylinder segment between previous and current position
                const length = GRID_SIZE;
                const cylGeo = new THREE.CylinderGeometry(0.3, 0.3, length, 10);
                const cyl = new THREE.Mesh(cylGeo, this.material);

                // Position cylinder midway and orient it
                cyl.position.set((prevX + this.x) / 2, (prevY + this.y) / 2, (prevZ + this.z) / 2);
                
                if (this.dir.x !== 0) {
                    cyl.rotation.z = Math.PI / 2;
                } else if (this.dir.z !== 0) {
                    cyl.rotation.x = Math.PI / 2;
                }
                this.group.add(cyl);

                this.segmentsDrawn++;

                // Reset pipe if bounds reached or max length hit
                if (
                    this.segmentsDrawn > this.maxSegments ||
                    Math.abs(this.x) > RANGE * GRID_SIZE ||
                    Math.abs(this.y) > RANGE * GRID_SIZE ||
                    Math.abs(this.z) > RANGE * GRID_SIZE
                ) {
                    scene.remove(this.group);
                    this.reset();
                }
            }
        }

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Add lighting for metallic pipe shine
            const ambientLight = new THREE.AmbientLight(0x333333);
            scene.add(ambientLight);

            const light1 = new THREE.DirectionalLight(0xffffff, 1);
            light1.position.set(10, 20, 30);
            scene.add(light1);

            const light2 = new THREE.DirectionalLight(0x888888, 0.5);
            light2.position.set(-10, -20, -30);
            scene.add(light2);

            // Initialize pipe systems
            for (let i = 0; i < MAX_PIPES; i++) {
                pipes.push(new PipeSystem());
            }

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('click', resetAllPipes, false);
        }

        function resetAllPipes() {
            pipes.forEach(p => {
                scene.remove(p.group);
                p.reset();
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);

            // Slowly rotate the entire scene for dynamic viewing angles
            scene.rotation.y += 0.002;
            scene.rotation.x += 0.001;

            // Slow down pipe growth rate so it feels authentic
            if (frameCount % 4 === 0) {
                pipes.forEach(p => p.update());
            }
            frameCount++;

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
